:root {
  --navy:#073b4c;
  --teal:#087f8c;
  --mint:#c9f4e7;
  --lime:#d8f36a;
  --ink:#18343d;
  --muted:#647b82;
  --paper:#f6faf8;
  --line:#e2eeea;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1160px,92%);margin:auto}
header{position:sticky;top:0;z-index:10;background:#f6faf8f2;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--navy);display:grid;place-items:center;color:var(--lime);font-size:28px;font-weight:800}
.brand strong{display:block;font:800 23px Manrope,sans-serif;letter-spacing:1.5px;color:var(--navy)}
.brand small{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:700}
.navlinks{display:flex;gap:22px;font-size:13px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 20px;background:var(--navy);color:white;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--teal);transform:translateY(-2px)}
.btn.outline{background:transparent;color:var(--navy);border:1px solid #b9d3cf}
.hero{padding:65px 0 75px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:45px}
.eyebrow,.kicker{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-1px}
h1{font-size:clamp(40px,5vw,66px);line-height:1.08;color:var(--navy);margin:20px 0}
h1 em{color:var(--teal);font-style:normal}
.hero-copy{font-size:16px;line-height:1.8;color:var(--muted);max-width:510px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
.hero-art{height:470px;position:relative}
.hero-photo{position:absolute;inset:0 15px 15px 15px;overflow:hidden;border-radius:34px;background:#d7eee7}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#073b4caa)}
.hero-caption{position:absolute;bottom:40px;left:35px;color:white;z-index:1}
.hero-caption h3{margin:5px 0}
.floating{position:absolute;background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 15px 45px #073b4c18;z-index:2}
.float-top{top:25px;left:0}
.float-bottom{bottom:0;right:0;max-width:210px}
.stats{background:var(--navy);color:white;padding:24px 0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat{text-align:center;border-right:1px solid #ffffff25;padding:8px}
.stat:last-child{border:0}
.stat strong{display:block}
.stat span{font-size:12px;color:#c4d9d9}
section.content{padding:75px 0}
.section-head{text-align:center;max-width:700px;margin:0 auto 38px}
.section-head h2{font-size:clamp(30px,4vw,44px);line-height:1.15;color:var(--navy);margin:12px 0}
.section-head p{color:var(--muted)}
.specialties{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.specialty{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}
.specialty:hover{transform:translateY(-4px);box-shadow:0 20px 50px #073b4c12}
.specialty-img{height:190px;overflow:hidden}
.specialty-img img{width:100%;height:100%;object-fit:cover}
.specialty-body{padding:22px}
.num{font-size:10px;font-weight:800;color:var(--teal);letter-spacing:1.3px}
.specialty h3{font-size:20px;line-height:1.3;color:var(--navy);margin:8px 0}
.specialty p{font-size:13px;color:var(--muted)}
